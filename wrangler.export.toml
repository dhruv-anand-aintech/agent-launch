name = "agl-recruitment-export-ingest"
main = "worker/export-ingest.js"
compatibility_date = "2026-08-27"
workers_dev = false

[observability]
enabled = true

[secrets]
required = ["UPLOAD_TOKEN"]

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "agl-recruitment-exports"

[[routes]]
pattern = "agl-exports.ainorthstar.tech"
custom_domain = true
